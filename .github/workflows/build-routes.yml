# Файлы дорог Кладезя для маршрутов без интернета (пешком, на машине, на велосипеде).
# Регион: данные OpenStreetMap (Geofabrik) → контур региона, как у карты (osmium extract)
# → граф дорог Valhalla (valhalla_build_tiles) → один файл routes-<регион>_<версия>.tar.
# Сразу после сборки — пробный маршрут на самом GitHub, чтобы видеть, что файл рабочий.
#
# Токены не нужны: выкладывает в свой репозиторий своими правами (github.token).
name: Сборка дорог для маршрутов

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Регионы (id через запятую), пусто — вся Россия'
        default: 'ru-central'
      upload:
        description: 'Выложить файлы в выпуск карт'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-routes
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  VALHALLA_IMAGE: ghcr.io/valhalla/valhalla:3.9.1

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      regions: ${{ steps.regions.outputs.json }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$REPO" --limit 50 --json tagName -q '.[].tagName' | grep '^maps-' | sort -r | head -1)
          [ -n "$tag" ] || { echo "нет выпуска карт"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#maps-}" >> "$GITHUB_OUTPUT"
      - id: regions
        env:
          ONLY_INPUT: ${{ inputs.only }}
        run: |
          all='ru-central,ru-northwest,ru-south,ru-north-caucasus,ru-volga,ru-urals,ru-siberia,ru-far-east-south,ru-far-east-north'
          r="${ONLY_INPUT:-$all}"
          echo "json=$(echo "$r" | jq -R -c 'split(",") | map(gsub("^[[:space:]]+|[[:space:]]+$"; "")) | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        region: ${{ fromJSON(needs.prepare.outputs.regions) }}
    env:
      REGION: ${{ matrix.region }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Освободить место, поставить osmium, скачать Valhalla
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          docker pull -q "$VALHALLA_IMAGE"
          df -h / | tail -1; free -g | head -2; nproc
      - name: Скачать данные OpenStreetMap
        run: tools/search-build/fetch-region.sh "$REGION" work
      - name: Вырезать регион по контуру карты
        run: |
          node tools/search-build/outlines.mjs --group russia --only "$REGION" --out work
          osmium extract -c work/extract.json work/source.osm.pbf --overwrite
          rm -f work/source.osm.pbf
          ls -la work/pbf
      - name: Граф дорог Valhalla
        run: |
          start=$(date +%s)
          docker run --rm -v "$PWD/work:/data" -e REGION "$VALHALLA_IMAGE" bash -c '
            set -e
            cd /data
            valhalla_build_config --mjolnir-tile-dir /data/tiles --mjolnir-tile-extract /data/routes.tar \
              --mjolnir-admin /data/admins.sqlite --mjolnir-timezone /data/timezones.sqlite \
              --mjolnir-concurrency "$(nproc)" > /data/valhalla.json
            valhalla_build_timezones > /data/timezones.sqlite || echo "часовые пояса не скачались — без них"
            valhalla_build_admins -c /data/valhalla.json "/data/pbf/$REGION.osm.pbf"
            /usr/bin/time -v valhalla_build_tiles -c /data/valhalla.json "/data/pbf/$REGION.osm.pbf" 2> /data/time.txt || { tail -50 /data/time.txt; exit 1; }
            valhalla_build_extract -c /data/valhalla.json -v --overwrite
          '
          echo "сборка: $(( ($(date +%s) - start) / 60 )) мин"
          grep -E "Maximum resident|Elapsed" work/time.txt || true
          sudo chown -R "$(id -u)" work
          out="work/routes-${REGION}_${VERSION}.tar"
          mv work/routes.tar "$out"
          ls -la "$out" work/admins.sqlite work/timezones.sqlite || true
          size=$(stat -c %s "$out")
          [ "$size" -lt 2100000000 ] || { echo "файл дорог больше 2 ГБ — GitHub не примет, нужно делить"; exit 1; }
      - name: Пробный маршрут
        run: |
          # Настройки сборки ждут файл /data/routes.tar — даём ссылку на готовый.
          ln -f "work/routes-${REGION}_${VERSION}.tar" work/routes.tar
          docker run -d --name vh -p 8002:8002 -v "$PWD/work:/data" "$VALHALLA_IMAGE" valhalla_service /data/valhalla.json 1
          for i in $(seq 1 90); do curl -sf localhost:8002/status >/dev/null && break; sleep 2; done
          curl -s localhost:8002/status | head -c 300; echo
          node tools/search-build/route-check.mjs "$REGION" || { docker logs --tail 50 vh; exit 1; }
          docker rm -f vh >/dev/null
          rm -f work/routes.tar
      - name: Выложить в выпуск карт
        if: inputs.upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="work/routes-${REGION}_${VERSION}.tar"
          gh release upload "$TAG" "$out" --repo "$REPO" --clobber
          mkdir -p parts
          node tools/search-build/attach.mjs describe --file "$out" --repo "$REPO" --tag "$TAG" > "parts/routes-$REGION.json"
          cat "parts/routes-$REGION.json"
      - uses: actions/upload-artifact@v4
        if: inputs.upload
        with:
          name: routes-${{ matrix.region }}
          path: parts/routes-${{ matrix.region }}.json
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success' && inputs.upload
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { path: parts, pattern: 'routes-*', merge-multiple: true }
      - name: Дописать файлы дорог в maps.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls parts/*.json >/dev/null 2>&1 || { echo "ни один регион не собрался"; exit 1; }
          gh release download "$TAG" --repo "$REPO" --pattern maps.json --dir base
          node tools/search-build/attach.mjs --manifest base/maps.json --parts parts
          gh release upload "$TAG" base/maps.json --repo "$REPO" --clobber
