# Указатели поиска Кладезя: города и сёла, улицы, адреса, места — для поиска на карте без интернета.
# Каждый регион: файлы OpenStreetMap (Geofabrik) → контур региона, как у карты (osmium extract)
# → нужные объекты (osmium tags-filter / export) → SQLite с полнотекстовым поиском (build_index.py).
# Файлы search-<регион>_<версия>.sqlite выкладываются в текущий выпуск карт, а в maps.json
# у пакета региона появляется поле search — по нему Кладезъ скачивает указатель вместе с картой.
#
# Россия — задание на федеральный округ. Другие группы (europe) — задание на файл Geofabrik
# (tools/search-build/plan.mjs): страна скачивается один раз, указатель — на каждую её карту
# (у Франции, Германии и других нарезанных стран — на каждую часть, чтобы был меньше 2 ГБ).
#
# Токены не нужны: выкладывает в свой репозиторий своими правами (github.token).
name: Сборка указателей поиска

on:
  workflow_dispatch:
    inputs:
      group:
        description: 'Группа: russia или europe'
        default: 'russia'
      only:
        description: 'Только эти регионы (Россия: id; другие группы: коды стран или id), пусто — вся группа'
        default: ''

permissions:
  contents: write

concurrency:
  group: build-search
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      jobs: ${{ steps.jobs.outputs.json }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Текущий выпуск карт — самый новый maps-ГГГГ-ММ.
          tag=$(gh release list --repo "$REPO" --limit 50 --json tagName -q '.[].tagName' | grep '^maps-' | sort -r | head -1)
          [ -n "$tag" ] || { echo "нет выпуска карт"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#maps-}" >> "$GITHUB_OUTPUT"
      - id: jobs
        env:
          GROUP_INPUT: ${{ inputs.group }}
          ONLY_INPUT: ${{ inputs.only }}
        run: |
          group="${GROUP_INPUT:-russia}"
          if [ "$group" = "russia" ]; then
            all='ru-central,ru-northwest,ru-south,ru-north-caucasus,ru-volga,ru-urals,ru-siberia,ru-far-east-south,ru-far-east-north'
            r="${ONLY_INPUT:-$all}"
            json=$(echo "$r" | jq -R -c --arg g "$group" 'split(",") | map(gsub("^[[:space:]]+|[[:space:]]+$"; "")) | map(select(length > 0))
              | map({key: ., regions: ., sources: "", group: $g})')
          else
            only=()
            [ -n "$ONLY_INPUT" ] && only=(--only "$ONLY_INPUT")
            json=$(node tools/search-build/plan.mjs --group "$group" "${only[@]}" | jq -c --arg g "$group" 'map(. + {group: $g})')
          fi
          echo "$json" | jq -r '.[] | "\(.key): \(.regions)"'
          echo "json=$json" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: ${{ matrix.job.key }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      # Не больше трёх скачиваний с Geofabrik одновременно — по их просьбе беречь сервер.
      max-parallel: 3
      matrix:
        job: ${{ fromJSON(needs.prepare.outputs.jobs) }}
    env:
      KEY: ${{ matrix.job.key }}
      REGIONS: ${{ matrix.job.regions }}
      SOURCES: ${{ matrix.job.sources }}
      GROUP: ${{ matrix.job.group }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Освободить место и поставить osmium
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          osmium --version | head -1
          df -h / | tail -1
      - name: Тесты сборщика
        run: |
          python3 -m unittest discover -s tools/search-build -p 'test_*.py'
          node --test tools/search-build/attach.test.mjs tools/search-build/plan.test.mjs
      - name: Скачать данные OpenStreetMap
        run: |
          if [ -z "$SOURCES" ]; then
            tools/search-build/fetch-region.sh "$KEY" work
          else
            tools/search-build/fetch-sources.sh work $SOURCES
          fi
      - name: Вырезать регионы по контуру карты
        run: |
          node tools/search-build/outlines.mjs --group "$GROUP" --only "$REGIONS" --out work
          # По две части за проход: шесть сразу (Франция, Италия) не помещаются в память сервера.
          n=$(jq '.extracts | length' work/extract.json)
          for ((i = 0; i < n; i += 2)); do
            jq ".extracts |= .[$i:$((i + 2))]" work/extract.json > work/batch.json
            osmium extract -c work/batch.json work/source.osm.pbf --overwrite
          done
          rm -f work/source.osm.pbf
          ls -la work/pbf
      - name: Собрать и выложить указатели
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p parts
          for REGION in ${REGIONS//,/ }; do
            echo "::group::$REGION"
            osmium tags-filter "work/pbf/$REGION.osm.pbf" \
              nwr/name nwr/addr:housenumber nwr/place \
              nwr/amenity=pharmacy,hospital,clinic,doctors,dentist,police,fire_station,fuel,atm,bank,toilets,drinking_water,shelter,post_office,charging_station,veterinary,water_point,ambulance_station,defibrillator,marketplace \
              -o work/filtered.osm.pbf --overwrite
            rm -f "work/pbf/$REGION.osm.pbf"
            out="work/search-${REGION}_${VERSION}.sqlite"
            osmium export work/filtered.osm.pbf -c tools/search-build/export-config.json -f geojsonseq \
              -x print_record_separator=false -o - |
              python3 tools/search-build/build_index.py --out "$out" --region "$REGION" --version "$VERSION"
            ls -la "$out"
            size=$(stat -c %s "$out")
            if [ "$size" -ge 2100000000 ]; then
              echo "::error::$REGION: указатель больше 2 ГБ — GitHub не примет"
              rm -f "$out"
              echo "::endgroup::"
              continue
            fi
            gh release upload "$TAG" "$out" --repo "$REPO" --clobber
            node tools/search-build/attach.mjs describe --file "$out" --repo "$REPO" --tag "$TAG" > "parts/search-$REGION.json"
            cat "parts/search-$REGION.json"
            rm -f "$out" work/filtered.osm.pbf
            echo "::endgroup::"
          done
          ls parts/*.json >/dev/null 2>&1 || { echo "ни один указатель не собрался"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-${{ matrix.job.key }}
          path: parts/search-*.json
          if-no-files-found: ignore

  publish:
    needs: [prepare, build]
    # Дописываем в список и то, что успело собраться, если часть регионов упала.
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { path: parts, pattern: 'search-*', merge-multiple: true }
      - name: Дописать указатели в maps.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls parts/*.json >/dev/null 2>&1 || { echo "ни один регион не собрался"; exit 1; }
          gh release download "$TAG" --repo "$REPO" --pattern maps.json --dir base
          node tools/search-build/attach.mjs --manifest base/maps.json --parts parts
          gh release upload "$TAG" base/maps.json --repo "$REPO" --clobber
